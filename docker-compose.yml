services:
  db:
    image: postgres:16
    container_name: echogpt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: echogpt
      POSTGRES_PASSWORD: echogpt
      POSTGRES_DB: echogpt
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: